<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8E72;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="overlay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.6" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGradient)"/>
  <rect width="1200" height="800" fill="url(#overlay)"/>

  <!-- Decorative circles -->
  <circle cx="200" cy="150" r="80" fill="#FFFFFF" opacity="0.1"/>
  <circle cx="1000" cy="700" r="120" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="600" cy="400" r="50" fill="#FFFFFF" opacity="0.05"/>

  <!-- Main content container -->
  <g transform="translate(600, 400)">
    <!-- Project Icon (Shield with warning) -->
    <g transform="translate(-80, -120)">
      <!-- Shield -->
      <path d="M0 0 L60 -40 L120 0 L120 60 Q60 100 60 100 Q60 100 0 60 Z"
            fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>

      <!-- Warning symbol -->
      <text x="30" y="40" font-size="60" text-anchor="middle" fill="#FFFFFF" opacity="0.9">⚠</text>
    </g>

    <!-- Project Title -->
    <text x="0" y="0" font-size="56" font-weight="bold" text-anchor="middle" fill="#FFFFFF">
      AI Phishing Detector
    </text>

    <!-- Subtitle -->
    <text x="0" y="60" font-size="18" text-anchor="middle" fill="#FFFFFF" opacity="0.95">
      Full-Stack Threat Detection System
    </text>

    <!-- Tech Stack Section -->
    <g transform="translate(-250, 120)">
      <text x="0" y="0" font-size="14" font-weight="bold" fill="#FFFFFF" opacity="0.9">TECH STACK</text>

      <!-- Tech badges -->
      <rect x="0" y="20" width="110" height="45" fill="#FFFFFF" opacity="0.15" rx="8" stroke="#FFFFFF" stroke-width="1.5"/>
      <text x="55" y="50" text-anchor="middle" font-size="13" fill="#FFFFFF">Python</text>

      <rect x="130" y="20" width="110" height="45" fill="#FFFFFF" opacity="0.15" rx="8" stroke="#FFFFFF" stroke-width="1.5"/>
      <text x="185" y="50" text-anchor="middle" font-size="13" fill="#FFFFFF">React</text>

      <rect x="260" y="20" width="110" height="45" fill="#FFFFFF" opacity="0.15" rx="8" stroke="#FFFFFF" stroke-width="1.5"/>
      <text x="315" y="50" text-anchor="middle" font-size="13" fill="#FFFFFF">FastAPI</text>

      <rect x="390" y="20" width="110" height="45" fill="#FFFFFF" opacity="0.15" rx="8" stroke="#FFFFFF" stroke-width="1.5"/>
      <text x="445" y="50" text-anchor="middle" font-size="13" fill="#FFFFFF">Scikit-learn</text>
    </g>

    <!-- Features -->
    <g transform="translate(-280, 220)">
      <text x="0" y="0" font-size="13" font-weight="bold" fill="#FFFFFF" opacity="0.9">KEY FEATURES</text>

      <text x="0" y="30" font-size="12" fill="#FFFFFF" opacity="0.85">✓ ML-based phishing classification</text>
      <text x="0" y="55" font-size="12" fill="#FFFFFF" opacity="0.85">✓ IOC extraction & threat intelligence</text>
      <text x="0" y="80" font-size="12" fill="#FFFFFF" opacity="0.85">✓ MITRE ATT&CK mapping</text>
      <text x="0" y="105" font-size="12" fill="#FFFFFF" opacity="0.85">✓ Professional SOC dashboard</text>
    </g>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="780" width="1200" height="20" fill="#FFFFFF" opacity="0.1"/>
</svg>